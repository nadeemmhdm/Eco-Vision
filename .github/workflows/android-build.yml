name: Build EcoVision Android App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --continue 2>&1 | tee gradle_output.log
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Post Build Failure Summary
        if: failure()
        run: |
          echo "## ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "### Compilation & Build Error Details:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |FAILED|Compilation error|Caused by:" -C 4 gradle_output.log | head -n 120 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Last 60 Lines of Gradle Output:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 gradle_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: " gradle_output.log | head -n 30 | while read -r line; do echo "::error::$line"; done

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_output.log

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ecovision-app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0.17
          name: EcoVision Release v1.0.17
          draft: false
          prerelease: false
          body: |
            ### 🚀 EcoVision Release v1.0.17 (Real Database Registration & Sign-In Fix)

            #### ✨ What's New in v1.0.17:
            - **✅ Fixed New Account Registration & Sign-In Persistence**: Configured `explicitNulls = false` in `SupabaseClient.jsonConfig` so PostgreSQL `DEFAULT now()` is used instead of sending `"created_at": null` (which previously caused `NOT NULL` constraint HTTP 400 errors and prevented new accounts from saving to Supabase).
            - **🗄️ Real Database Only**: `createProfile` now verifies HTTP 2xx persistence before signing in, and all example users, products, and seed data are cleared from Supabase so only real database records exist.

            #### ✨ What's New in v1.0.16:
            - **🎨 Google Stitch Login & Register Redesign**: Updated `AuthScreen` to use the unified Modern Organic Minimalism theme (`MaterialTheme.colorScheme` adaptive Light/Dark canvas, rounded 14dp fields, Stitch segmented pill toggle, and responsive `520.dp` container).
            - **⚡ Faster Startup & Zero Lag**: Parallelized Home screen API fetches (`async`), added Ktor `HttpTimeout` (12s) to prevent slow-network hangs, moved IP lookups off the main thread (`Dispatchers.IO`), and scoped offline banner animations only when offline.

            #### ✨ What's New in v1.0.15:
            - **🏷️ Dynamic App Version**: Splash Screen and About page now dynamically read the installed APK `versionName` instead of a hardcoded `v1.0.11`.
            - **🔒 Profile & Settings Cleanup**: Removed duplicate 2FA, Security/Device Compliance, Account Deletion, and Sign Out sections from Profile (kept cleanly in Settings).
            - **🚫 Zero Demo Data**: Removed all hardcoded demo accounts, demo vouchers, demo pickups, demo godown lots, demo marketplace items, and static placeholders.
            - **🛒 Upcycle Store COD & Offline Guard**: Enforced Cash on Delivery (COD Only) checkout and blocked database writes while offline.
            - **📡 Offline Caching & Animated No-Internet Banner**: Cached online DB feeds for offline viewing with a global animated No-Internet banner.
            - **🌓 Theme Mode Switcher**: Added System / Light / Dark appearance switcher in Settings.

            #### ✨ What's New in v1.0.13:
            - **🎨 Complete Google Stitch Design System Integration**:
              - Unified Modern Organic Minimalism tokens (`#059669` / `#10B981` Emerald, `#F8FAFC` Light Canvas, `#FFFFFF` 20dp cards, pill-shaped `EcoButton` CTAs, and `600.dp` centralized responsive tablet/desktop container).
              - Designed all 10 role-based and common screens in Google Stitch (`projects/16102458572209495987`).
            - **👤 Role-Based Profile & Settings**:
              - Profile dynamically adapts by role (Citizen: Wallet & Referral Share; Pickup Agent: Vehicle Desk; Buyer Company: B2B GSTIN Credentials; Super Admin: Root Governance Authority).
              - Reused common **About**, **Terms and Conditions**, **Privacy Policy**, and **FAQ** pages across all roles.
            - **✨ Smooth Animations & Shimmer Loading**:
              - Added `StitchSkeletonCard` shimmer loading animation, snappy bottom nav pill highlights, pill button spring tap scale, 3D flippable voucher cards, and smooth `NavHost` transitions while preserving 100% of existing business logic.

            #### 🚀 What's New in v1.0.10:
            - **🎬 Smooth Animated Navigation & Floating Dock**:
              - Added fluid horizontal slide + fade transitions across all `NavHost` routes.
              - Smooth `AnimatedVisibility` slide-in/out for the floating bottom dock when switching between dashboards and scanner/verification screens.
              - Proper `navigationBarsPadding()` for clean gesture-bar clearance.
            - **🫰 Tactile Micro-Interactions**:
              - Spring-physics press scale feedback (`0.97x`) on all `EcoButton` actions.
              - Smoothly animated `ThresholdProgressBar` fill transitions.
            - **🌗 Full Light & Dark Theme Consistency**:
              - Made `GlassCard`, `EcoButton`, `ThresholdProgressBar`, and `Image3PickupLiveCard` (Live Tracking) fully theme-aware (`MaterialTheme.colorScheme`) so Light Mode and Dark Mode both look crisp and cohesive.
            - **🔍 Instant Waste Search Guide on Home**:
              - Typing in the Home search bar displays live waste sorting & price-per-kg suggestions with 1-tap launch into AI Scanner.

            #### 🚀 What's New in v1.0.9:
            - **🧠 AI Waste Identification & Smart Classification**:
              - Automated classification into **Recyclable** vs **Non-Recyclable** materials.
              - **Recyclable Bin Button Logic**: Hides the "Add to Recyclable Bin" button entirely for non-recyclable materials with clear segregation advisory. Displays button for recyclable materials.
              - Full Waste Details: Waste Name, Category, Material, Recyclability status badge, Applicable unit rate (₹/kg), and total estimated value.
              - Live Weight Adjustment Slider/Stepper with real-time total collection weight & price calculation.
            - **🎨 "Upscale This Product" YouTube DIY Integration**:
              - 1-tap "Upscale This Product 🎨" action in waste details.
              - Curated list of 2 to 5 relevant YouTube videos demonstrating creative DIY ways to transform scanned waste materials into functional products.
              - Rich video card previews with title, channel name, duration badge, and direct YouTube player launch.
            - **🗑️ Virtual Bin Item Visibility Fix**:
              - Added synchronized in-memory caching for scanned waste items added to the virtual bin, guaranteeing instant visibility even offline or before cloud sync.
            - **🔐 2FA TOTP QR Code & Mandatory Sign-In Verification**:
              - Instant QR Code generator in Profile Settings for seamless 1-scan setup in Google Authenticator, Microsoft Authenticator, or Authy.
              - Enforced 6-digit TOTP verification check upon subsequent logins for all accounts with 2FA enabled.
              - Removed redundant user role badge in Profile header for a cleaner look.
            - **💰 Wallet Min ₹100 Cash Redemption via UPI**:
              - Updated minimum cash redemption threshold to ₹100 (1,000 Coins at 10 Coins = ₹1).
              - Coin-based voucher and coupon redemptions with waiting list tracking.
            - **🗺️ Interactive Live Route Map with Google Maps Integration**:
              - Embedded interactive map with real street and road network, animated collection vehicle marker, user destination pin, and route polyline.
              - 1-tap "Open in Google Maps ↗" launcher for real-time turn-by-turn navigation.
            - **✨ Animated Bottom Navigation Bar**:
              - Bouncy spring physics scaling and vertical translation for active tabs.
              - Animated sliding indicator pill under the active icon.
              - Smooth color crossfading and pulsing center scanner FAB button.
              - Pulsing splash screen loading icon with glowing halo ring.
              - Onboarding screen hero winding road illustration and top brand bar.
              - System Android adaptive launcher icon (`ic_launcher_foreground.xml`) and Android 12+ splash theme (`themes.xml`).
              - Authentication sign-in/register header and app top bars.
            - **✨ Streamlined Stitch User Dashboard**:
              - Removed redundant non-functional cards and cluttered filler elements for maximum clarity and speed.
              - Curved emerald top hero header with official logo, "Hi [User Name]!", "122 Items" recycled counter, and 3 circular progress gauges (Recycled 65%, Compost 5%, Rubbish 2%).
              - Search bar with instant camera scan button.
              - 3 Interactive Smart Bins (Green Caddy for Organics, Red Bin for Hazardous/E-Waste, Blue Bin for Dry Paper/Plastics).
            - **📞 100% Interactive Live Pickup Tracking**:
              - Real working **Call** button (launches Android phone dialer for assigned agent Rafiq Khan).
              - Real working **Chat** button (opens live in-app chat dialog with Rafiq Khan).
              - Real working **Verify Vehicle** button (opens modal with vehicle plate `KL-07-AB-1234`, driver badge, and secure 4-digit doorstep PIN handshake `4829`).
              - 1-click **Schedule Doorstep Pickup** modal with address and time-slot selection.
            - **🛡️ 100% Real Working Admin & Governance Desks**:
              - KYC Verification Desk with seed pending applicants (Vishnu Namboothiri, Malabar Recyclers) with real document proofs.
              - Working **Accept KYC ✓** button (approves applicant, purges document for privacy compliance, and moves them to approved).
              - Working **Reject KYC** button (selects rejection reason and enforces cooldown).
              - User Governance Desk (Block/Unblock, 30-Day Safe Deletion).
              - Voucher Studio (create voucher with image and coin cost, real-time 3D flippable preview).
              - Cash Redeems Desk (verify UPI IDs and approve direct wallet cash payouts: 10 Coins = ₹1).
            - **✨ Simplified Multi-Page Admin & Company Dashboards**:
              - Transformed monolithic dashboard into 5 clean, uncluttered sub-pages / tabs:
                - `01. KYC Verification Desk`: Instant identity review, proof inspection, one-click "Accept KYC ✓" approval.
                - `02. User Governance Desk`: Manage citizen, agent, and company accounts, block/unblock, deletion tracking.
                - `03. Voucher Studio & Card Vault`: Flippable 3D voucher models, voucher publishing, and waiting list code dispatch.
                - `04. Cash Redeems & UPI Settlements`: Verify UPI IDs and approve direct wallet cash payouts (10 Coins = ₹1).
                - `05. Fleet & System Settings`: Agent vehicle change requests with photo inspection, emergency maintenance mode, and dynamic pricing slabs.
              - Company Dashboard split into 3 clean tabs:
                - `01. Godown Marketplace`: Live pooled certified lots with material filters and wholesale pricing.
                - `02. Orders & Manifests`: Digital waybills with manifest numbers (`EV-MANIFEST-XXXX`) and dispatch records.
                - `03. ESG & Credentials`: Verified B2B buyer accreditation, cumulative carbon offset, and compliance badges.
            - **🔍 Uploaded KYC Proof Viewer & Accept Button Fix**:
              - New `ProofViewerDialog` modal to inspect high-resolution citizen ID and agent vehicle photos.
              - Fixed "Accept KYC ✓" button availability so admins can approve or re-verify any profile without friction.
            - **🃏 3D Flippable Voucher Card Model**:
              - Interactive physical voucher card rendering in 3D perspective (`graphicsLayer` with 180° `rotationY`).
              - Front side features brand logo, title, cash discount value, and Coin Cost with `EcoCoinIcon`.
              - Back side flips smoothly to reveal the digital security barcode simulation, unique voucher PIN (`ECO-XXXX-YYYY`), and redemption guidelines.
            - **💧 Liquid Glass UI & UX Design**:
              - Translucent frosted glass containers (`LiquidGlassCard`) with dual-layer specular highlight borders (`#10B981` / `#60A5FA`).
              - Shimmering backdrop depth and water-refractive surface styling across cards, banners, and modals.
            - **🤖 3D Style Animated Mascot Characters**:
              - "Leafy" 3D AI eco mascot (`AnimatedCharacterHero`) featuring smooth floating physics and pulsing halo glow.
            - **📱 Floating Center Scanner FAB (Matching Reference Images 1, 2 & 3)**:
              - Custom `EcoFloatingBottomBar` with elevated circular emerald green scanner button (`#16A34A` to `#15803D`) hovering above the dock.
            - **🚚 Image 3 Onboarding Screen & Live Tracking**:
              - "Pickup On Time." hero onboarding view with 3D recycling truck driving on winding road, green location pin, carousel indicator dots, and "Get Started ->" green pill button.
              - Complete live tracking screen with scheduled slot banner, 4-step horizontal stepper, interactive map route, driver profile card (Rafiq Khan), and Quick Actions (Call, Chat, Verify Vehicle).
            - **📸 Image 1 AI Scan & Instructions Flow**:
              - Viewfinder with corner reticle brackets `[  ]`, "Start Scan" green button, 3-column material table, and dedicated Screen 4 Recycling Instructions with Curbside Pickup card and drop-off hubs.

            #### 🚀 What's New in v1.0.2:
            - **📷 First-Time Camera Access & Device Storage**: Runtime camera permissions (`rememberLauncherForActivityResult`), photo capture (`TakePicturePreview`), gallery image picking, and local device image caching (`cacheDir/waste_scans/`).
            - **🤖 Google Gemini 1.5 Flash Vision AI**: Real Gemini Vision API integration (`v1beta/models/gemini-1.5-flash:generateContent`) analyzing waste scrap images with base64 payload, circular economy classification, and in-app API key settings.
            - **🛍️ Upcycled Marketplace E-Commerce & Free Delivery**:
              - Product details modal with source scrap badge, pricing, and description.
              - Live shopping cart drawer with quantity increment/decrement controls.
              - **Free Delivery Engine**: Orders of ₹200 and above qualify for **FREE DELIVERY** (orders < ₹200 have a nominal ₹25 delivery fee).
              - Online checkout dispatching pickup/delivery orders directly to neighborhood agents.
            - **🍃 Leaf Coin Vouchers & Admin Voucher Creator**:
              - Users browse admin-listed partner discount vouchers and redeem Leaf Coins for active coupon codes.
              - Super Admin can list new promotional vouchers with brand name, image URL, coin cost, and discount value.
            - **🛡️ Super Admin User Moderation Desk**:
              - Full user management: filter profiles by role and KYC status.
              - Inspect uploaded proof documents (Aadhaar, GSTIN, Vehicle plate `KL-07-CD-5678`).
              - Approve, reject KYC, block, ban, or delete accounts.
            - **📜 Interactive Terms & Conditions & Privacy Policy**:
