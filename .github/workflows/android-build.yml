            - **⚡ Resilient Sign-In & Supabase Storage**:
              - Clean sign-in screen with discreet demo accounts trigger.
              - Resilient instant offline/latency fallback for test credentials (`adhil`, `rahul_agent`, `greenloop_co`, `admin`).
              - Real Supabase bucket `ecovision-media` active for waste photos and vouchers.
            - **Adaptive Auth & KYC**: Mobile OTP / Username + 2FA (TOTP & Email OTP) + Aadhaar / GST document onboarding.
            - **AI Waste Scanner**: Instant YOLOv8-simulated material identification, recyclable grading, confidence scoring, and DIY upcycling recommendations.
            - **Weight-Based Pricing Engine**: Dynamic per-kg pricing slabs with physical certified scale disclaimer.
            - **Raw Waste Virtual Bin**: Minimum pickup threshold enforcement (₹100 / 3kg) locking collection request until met.
            - **Doorstep Security**: Agent vehicle photo and license plate verification before waste handoff.
            - **Godown Inventory Gate**: Strict acceptance protocol before waste is pooled for B2B buyer companies.
            - **B2B Bulk Procurement**: Multi-household pooled waste purchasing with automated manifests and ESG carbon offset calculations.
            - **12-Hour Exclusive Rating Window**: Post-pickup agent reviews & dispute reporting.
            - **Leaf Coin Rewards**: Weight-based gamification with UPI cash and eco-voucher redemption.
            - **Admin Governance**: Maintenance mode switchboard, KYC desk, and dynamic pricing engine.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
